version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gulyay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gulyay_db
      POSTGRES_USER:     gulyay
      POSTGRES_PASSWORD: gulyay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulyay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gulyay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    # Локальный аналог S3 для разработки
    image: minio/minio:latest
    container_name: gulyay_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     gulyay
      MINIO_ROOT_PASSWORD: gulyay123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
